[build]
  command = "cd backend && npm install && npm run build && cd .. && ng build"
  publish = "dist/logilink/browser"

[functions]
  directory = "netlify/functions"
  node_bundler = "zisi"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
